apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: localopsbot
    component: api

spec:
  replicas: {{ .Values.api.replicaCount }}

  selector:
    matchLabels:
      app: localopsbot
      component: api

  template:
    metadata:
      labels:
        app: localopsbot
        component: api

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3